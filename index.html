<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#eef0ed"
        media="(prefers-color-scheme: light)"
    >

    <meta
        name="theme-color"
        content="#14171a"
        media="(prefers-color-scheme: dark)"
    >

    <meta
        name="description"
        content="کاتالوگ محصولات لوله، مشخصات و قیمت روز محصولات"
    >

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="کاتالوگ لوله و محصولات">
    <meta property="og:description" content="مشخصات و قیمت روز محصولات لوله">
    <meta property="og:url" content="https://intonation777.github.io/pipes/">
    <meta property="og:image" content="https://intonation777.github.io/pipes/preview-v2.JPG">
    <meta property="og:image:secure_url" content="https://intonation777.github.io/pipes/preview-v2.JPG">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter / Telegram compatible -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="کاتالوگ لوله و محصولات">
    <meta name="twitter:description" content="مشخصات و قیمت روز محصولات لوله">
    <meta name="twitter:image" content="https://intonation777.github.io/pipes/preview-v2.JPG">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
    <rect width='100' height='100' rx='22' fill='%23b1551f'/>
    <path d='M25 25h25v25H25zM50 50h25v25H50z' fill='white'/>
    <path d='M50 25v25M25 50h25' stroke='white' stroke-width='8'/>
    </svg>">

    <title>کاتالوگ لوله | قیمت و مشخصات محصولات</title>

    <!--
        این اسکریپت کوچک قبل از رندر صفحه اجرا می‌شود تا از
        چشمک زدن رنگ (Flash of wrong theme) هنگام بارگذاری جلوگیری کند.
    -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("pipes-theme");
                if (saved === "dark" || saved === "light") {
                    document.documentElement.setAttribute("data-theme", saved);
                }
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="container header-content">

            <div class="brand">

                <div class="brand-mark">
                    <span>▥</span>
                </div>

                <div class="brand-text">

                    <h1>
                        کاتالوگ لوله
                    </h1>

                    <p>
                        مشخصات، سایز و قیمت روز محصولات
                    </p>

                </div>

            </div>

            <div class="header-actions">

                <button
                    type="button"
                    class="theme-toggle"
                    id="themeToggle"
                    aria-label="تغییر حالت روشن و تاریک"
                    title="تغییر حالت نمایش"
                >
                    <span class="theme-icon theme-icon-light">☀</span>
                    <span class="theme-icon theme-icon-dark">☾</span>
                </button>

                <a
                    class="download-btn"
                    href="pipes.xlsx"
                    download
                >

                    <span class="download-icon">
                        ↓
                    </span>

                    <span class="download-label">
                        دانلود Excel
                    </span>

                </a>

            </div>

        </div>

    </header>



    <main class="container main-content">


        <!-- =========================
             HERO + SEARCH
        ========================== -->

        <section class="hero">

            <div class="hero-text">

                <h2>
                    محصول موردنظرتان را پیدا کنید
                </h2>

                <p>
                    یک دسته‌بندی را انتخاب کنید یا نام محصول، سایز و ضخامت
                    آن را در جستجو تایپ کنید.
                </p>

            </div>

            <div class="hero-stats">

                <div class="stat-chip">
                    <strong id="productCount">۰</strong>
                    <span>محصول</span>
                </div>

                <div class="stat-chip stat-chip-update">
                    <span class="stat-chip-label">بروزرسانی</span>
                    <strong id="lastUpdate">−</strong>
                </div>

            </div>

        </section>


        <div class="search-box">

            <span class="search-icon">
                ⌕
            </span>

            <input
                type="search"
                id="searchInput"
                autocomplete="off"
                placeholder="جستجوی محصول، سایز، ضخامت و..."
                inputmode="search"
            >

            <button
                type="button"
                class="clear-search"
                id="clearSearch"
                aria-label="پاک کردن جستجو"
            >
                ×
            </button>

        </div>


        <!-- =========================
             CATEGORIES
        ========================== -->

        <section class="categories-section">

            <div
                id="categoryMenu"
                class="category-cards"
            ></div>

        </section>



        <!-- =========================
             PRODUCT TABLE
        ========================== -->

        <section class="products-section">

            <div class="products-header">

                <h3>
                    لیست محصولات
                </h3>

                <div
                    id="resultStatus"
                    class="result-status"
                >
                    -
                </div>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr id="tableHead">
                        </tr>

                    </thead>

                    <tbody id="productsTable">
                    </tbody>

                </table>

            </div>

        </section>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <div class="container footer-content">

            <div>
                کاتالوگ محصولات
            </div>

            <span>
                © ۲۰۲۶
            </span>

        </div>

    </footer>



    <script src="app.js"></script>

</body>

</html>
