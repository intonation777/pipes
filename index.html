<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>کاتالوگ لوله</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="container header-content">

        <div>
            <h1>کاتالوگ لوله</h1>
            <p>مشخصات و قیمت روز محصولات</p>
        </div>

        <a
            class="download-btn"
            href="pipes.xlsx"
            download
        >
            📥 دانلود لیست Excel
        </a>

    </div>

</header>


<main class="container">

<section class="hero">

    <div class="hero-text">

        <span class="eyebrow">CATALOG</span>

        <h2>لیست محصولات</h2>

        <p>
            محصولات را بر اساس دسته‌بندی انتخاب کنید و
            قیمت و مشخصات به‌روز را مشاهده کنید.
        </p>

    </div>

    <div class="search-box">

        <span class="search-icon">⌕</span>

        <input
            type="text"
            id="searchInput"
            placeholder="جستجوی نام محصول، سایز، ضخامت و..."
        >

    </div>

</section>

<section class="categories-section">

    <div class="section-title">



    </div>

    <div id="categoryMenu" class="category-cards"></div>

</section>


    <section class="info">

        <div>
            <span>تعداد محصولات</span>
            <strong id="productCount">0</strong>
        </div>

        <div>
            <span>آخرین بروزرسانی</span>
            <strong id="lastUpdate">-</strong>
        </div>

    </section>


    <section class="table-wrapper">

        <table>

            <thead>
                <tr id="tableHead">
                </tr>
            </thead>

            <tbody id="productsTable">
            </tbody>

        </table>

    </section>

</main>


<footer>

    <div class="container">

        <p>
            © 2026 - کاتالوگ محصولات
        </p>

    </div>

</footer>


<script src="app.js"></script>

</body>
</html>
